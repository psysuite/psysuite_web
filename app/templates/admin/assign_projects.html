{% extends "base.html" %}

{% block title %}Assign Projects - PsySuite Web Manager{% endblock %}

{% block content %}
<div class="content">
    <h2>Assign Projects to {{ user.email }}</h2>
    
    <form method="POST">
        <div class="form-group">
            <label>Available Projects:</label>
            <div style="max-height: 400px; overflow-y: auto; border: 1px solid #ced4da; padding: 1rem; border-radius: 4px;">
                {% for project in all_projects %}
                <div class="form-check" style="margin-bottom: 0.5rem;">
                    <input type="checkbox" 
                           class="form-check-input" 
                           id="project_{{ project.id }}" 
                           name="project_ids" 
                           value="{{ project.id }}"
                           {{ 'checked' if project.id in current_assignments else '' }}>
                    <label class="form-check-label" for="project_{{ project.id }}">
                        <strong>{{ project.name }}</strong>
                        <br>
                        <small class="text-muted">
                            Created: {{ project.created_at.strftime('%Y-%m-%d') if project.created_at else 'Unknown' }} | 
                            Created by: {{ project.created_by or 'Unknown' }}
                        </small>
                    </label>
                </div>
                {% endfor %}
            </div>
        </div>
        
        <div class="form-group">
            <button type="submit" class="btn btn-primary">Update Assignments</button>
            <a href="{{ url_for('web.users') }}" class="btn btn-secondary">Cancel</a>
        </div>
        
        <div class="form-group">
            <button type="button" onclick="selectAll()" class="btn btn-info btn-sm">Select All</button>
            <button type="button" onclick="selectNone()" class="btn btn-info btn-sm">Select None</button>
        </div>
    </form>
</div>
{% endblock %}

{% block scripts %}
<script>
function selectAll() {
    document.querySelectorAll('input[name="project_ids"]').forEach(cb => {
        cb.checked = true;
    });
}

function selectNone() {
    document.querySelectorAll('input[name="project_ids"]').forEach(cb => {
        cb.checked = false;
    });
}
</script>

<style>
.form-check {
    padding-left: 1.25rem;
}

.form-check-input {
    margin-left: -1.25rem;
}

.form-check-label {
    display: block;
    padding-left: 0.5rem;
}
</style>
{% endblock %}
